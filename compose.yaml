services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reviewdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewdock}
      POSTGRES_DB: ${POSTGRES_DB:-reviewdock}
    volumes:
      - reviewdock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  reviewdock_pgdata:
