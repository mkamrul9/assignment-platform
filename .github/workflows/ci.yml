name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewdock
          POSTGRES_PASSWORD: reviewdock
          POSTGRES_DB: reviewdock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewdock -d reviewdock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reviewdock:reviewdock@127.0.0.1:5432/reviewdock?schema=public
      JWT_SECRET: ci-reviewdock-jwt-secret-value-32chars-min
      JWT_ISSUER: reviewdock
      JWT_AUDIENCE: reviewdock-web
      WEB_ORIGINS: http://127.0.0.1:3010,http://localhost:3010
      TRUST_PROXY: "1"
      SESSION_COOKIE_NAME: reviewdock_session
      MENTOR_NAME: CI Mentor
      MENTOR_EMAIL: ci-mentor@example.com
      MENTOR_PASSWORD: ci-mentor-pass-1
      E2E_DATABASE_NAME: reviewdock_e2e
      E2E_WEB_PORT: "3010"
      E2E_API_PORT: "4010"
      E2E_JWT_SECRET: e2e-reviewdock-jwt-secret-32chars-min!!
      API_INTERNAL_URL: http://127.0.0.1:4010
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Format, lint, and typecheck
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Persistence checks
        run: npm run db:check

      - name: Authentication checks
        run: npm run auth:check

      - name: Submission checks
        run: npm run submissions:check

      - name: Review checks
        run: npm run reviews:check

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
